<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>快乐能源 · 主持台</title>
  <link rel="stylesheet" href="/common.css">
</head>
<body class="big">
  <div id="setup" class="card" style="max-width:430px;margin:40px auto">
    <h1>快乐能源 · 主持台</h1>
    <input id="hostName" value="主持人" placeholder="主持人称呼">
    <div class="row">队伍数 <input id="teamCount" type="number" min="2" max="8" value="2" style="width:80px"></div>
    <button id="createBtn">创建房间</button>
    <button class="ghost" id="resumeBtn">恢复上次房间</button>
  </div>
  <div id="app" style="display:none">
    <div class="topbar">
      <div id="phaseTitle"></div>
      <div class="row"><button class="compact ghost" id="newRoomBtn">新开房间</button><div class="timer" id="timer">--:--</div></div>
    </div>
    <main id="view"></main>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/host/host.js"></script>
</body>
</html>
